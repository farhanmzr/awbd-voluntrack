<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Skill Form')}"></head>

<body>

    <div class="admin-shell">
        <div th:replace="~{fragments/admin-navbar :: adminSidebar}"></div>

        <main class="admin-content">
            <div th:replace="~{fragments/admin-navbar :: adminTopbar}"></div>

            <div class="admin-main">
                <div class="row justify-content-center">
                    <div class="col-lg-7">
                        <div class="card admin-panel-card">
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <div>
                                        <h1 class="fw-bold mb-1"
                                            th:text="${skill.id == null} ? 'Create Skill' : 'Edit Skill'">
                                            Skill Form
                                        </h1>
                                        <p class="text-muted mb-0">Create or update skill data.</p>
                                    </div>
                                    <a th:href="@{/admin/skills}" class="btn btn-outline-secondary rounded-4">
                                        Back
                                    </a>
                                </div>

                                <form th:action="@{${formAction}}" th:object="${skill}" method="post">
                                    <input type="hidden" th:field="*{id}">

                                    <div class="mb-4">
                                        <label for="name" class="form-label">Skill Name</label>
                                        <input type="text" id="name" th:field="*{name}" class="form-control rounded-4"
                                            required>
                                        <div th:if="${#fields.hasErrors('name')}" class="text-danger mt-1">
                                            <small th:errors="*{name}"></small>
                                        </div>
                                    </div>

                                    <div class="d-flex gap-2">
                                        <button type="submit" class="btn btn-success rounded-4">
                                            <i class="bi bi-check-circle me-2"></i>Save Skill
                                        </button>
                                        <a th:href="@{/admin/skills}"
                                            class="btn btn-outline-secondary rounded-4">Cancel</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/footer-scripts :: scripts}"></div>

</body>

</html>
