<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Manage Categories')}"></head>

<body>

    <div class="admin-shell">
        <div th:replace="~{fragments/admin-navbar :: adminSidebar}"></div>

        <main class="admin-content">
            <div th:replace="~{fragments/admin-navbar :: adminTopbar}"></div>

            <div class="admin-main">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="fw-bold mb-1">Manage Categories</h1>
                        <p class="text-muted mb-0">Manage volunteer program categories.</p>
                    </div>
                    <a class="btn btn-success rounded-4" th:href="@{/admin/categories/create}">
                        <i class="bi bi-plus-lg me-2"></i>Create New Category
                    </a>
                </div>

                <div th:if="${#lists.isEmpty(categories)}" class="alert alert-info rounded-4">
                    No categories found.
                </div>

                <div th:unless="${#lists.isEmpty(categories)}" class="card admin-panel-card">
                    <div class="card-body p-4">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Description</th>
                                        <th style="width: 170px;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="category : ${categories}">
                                        <td th:text="${category.id}">1</td>
                                        <td class="fw-semibold" th:text="${category.name}">Category Name</td>
                                        <td th:text="${category.description}">Description</td>
                                        <td>
                                            <a class="btn btn-sm btn-outline-warning rounded-3 me-1"
                                                th:href="@{/admin/categories/edit/{id}(id=${category.id})}">
                                                Edit
                                            </a>
                                            <a class="btn btn-sm btn-outline-danger rounded-3"
                                                th:href="@{/admin/categories/delete/{id}(id=${category.id})}"
                                                onclick="return confirm('Are you sure you want to delete this category?');">
                                                Delete
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/footer-scripts :: scripts}"></div>

</body>

</html>
