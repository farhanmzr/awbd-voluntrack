<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Edit Admin Profile')}"></head>

<body>

    <div class="admin-shell">
        <div th:replace="~{fragments/admin-navbar :: adminSidebar}"></div>

        <main class="admin-content">
            <div th:replace="~{fragments/admin-navbar :: adminTopbar}"></div>

            <div class="admin-main">
                <div class="row justify-content-center">
                    <div class="col-lg-8">
                        <div class="card admin-panel-card">
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <div>
                                        <h1 class="fw-bold mb-1">Edit Admin Profile</h1>
                                        <p class="text-muted mb-0">Update your administrator information.</p>
                                    </div>
                                    <a th:href="@{/admin/profile}" class="btn btn-outline-secondary rounded-4">
                                        Cancel
                                    </a>
                                </div>

                                <form th:action="@{/admin/profile/save}" th:object="${profile}" method="post">
                                    <input type="hidden" th:field="*{id}" />

                                    <div class="mb-3">
                                        <label class="form-label">Full Name</label>
                                        <input type="text" th:field="*{fullName}" class="form-control rounded-4">
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Phone Number</label>
                                        <input type="text" th:field="*{phoneNumber}" class="form-control rounded-4">
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Date of Birth</label>
                                        <input type="date" th:field="*{dateOfBirth}" class="form-control rounded-4">
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">City</label>
                                        <input type="text" th:field="*{city}" class="form-control rounded-4">
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label">Bio</label>
                                        <textarea th:field="*{bio}" class="form-control rounded-4" rows="4"></textarea>
                                    </div>

                                    <div class="d-flex gap-2">
                                        <button type="submit" class="btn btn-success rounded-4">
                                            <i class="bi bi-check-circle me-2"></i>Save Profile
                                        </button>
                                        <a th:href="@{/admin/profile}"
                                            class="btn btn-outline-secondary rounded-4">Cancel</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/footer-scripts :: scripts}"></div>

</body>

</html>
